[package]
name = "sandbox-core"
description = "Domain model and runtime adapters for Sandbox Watcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
bollard = { version = "0.21", features = ["chrono"] }
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
