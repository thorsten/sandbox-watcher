name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy -p sandbox-core --all-targets -- -D warnings
      - run: cargo test -p sandbox-core
      - name: Start a sandbox-like container for the Docker conformance test
        if: runner.os == 'Linux'
        run: |
          docker run -d --name sandbox-watcher-test \
            --label sandbox.project=watcher-test --label sandbox.hash=abcdef123456 \
            alpine:3 sh -c 'mkdir -p /tmp/sandbox-sessions && touch /tmp/.sandbox-ready && echo ready && sleep 600'
          for i in $(seq 1 20); do
            docker exec sandbox-watcher-test test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
      - name: Docker conformance test
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_TEST_SLUG: watcher-test
        run: cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Remove the test container
        if: always() && runner.os == 'Linux'
        run: docker rm -f sandbox-watcher-test || true
      - name: Start Podman's Docker-compatible socket and a sandbox-like container
        if: runner.os == 'Linux'
        run: |
          podman --version
          # Rootless Podman defaults to journald for events, which runners may lack.
          mkdir -p ~/.config/containers
          printf '[engine]\nevents_logger = "file"\n' > ~/.config/containers/containers.conf
          podman info --format 'events logger: {{.Host.EventLogger}}, cgroups: {{.Host.CgroupsVersion}}'
          nohup podman system service --time=0 unix:///tmp/podman.sock >/tmp/podman-service.log 2>&1 &
          for i in $(seq 1 30); do [ -S /tmp/podman.sock ] && break || sleep 0.5; done
          podman run -d --name sandbox-watcher-podman \
            --label sandbox.project=watcher-podman --label sandbox.hash=abcdef123456 \
            docker.io/library/alpine:3 sh -c 'mkdir -p /tmp/sandbox-sessions && touch /tmp/.sandbox-ready && echo ready && sleep 600'
          for i in $(seq 1 20); do
            podman exec sandbox-watcher-podman test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
      - name: Podman conformance test
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_RUNTIME: podman
          SANDBOX_WATCHER_TEST_SLUG: watcher-podman
          DOCKER_HOST: unix:///tmp/podman.sock
        run: cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Podman diagnostics
        if: failure() && runner.os == 'Linux'
        run: |
          set +e
          echo "--- podman version"; podman version
          echo "--- podman info (host)"; podman info --format '{{json .Host}}' | head -c 2000; echo
          API=http://d/v1.47
          S=/tmp/podman.sock
          echo "--- compat /version"; curl -s --unix-socket $S $API/version | head -c 600; echo
          echo "--- compat containers (label filter)"; curl -s --unix-socket $S "$API/containers/json?all=true&filters=%7B%22label%22%3A%5B%22sandbox.project%3Dwatcher-podman%22%5D%7D" | head -c 3000; echo
          ID=$(podman ps -aq --filter name=sandbox-watcher-podman | head -1)
          echo "--- compat inspect"; curl -s --unix-socket $S $API/containers/$ID/json | head -c 4000; echo
          echo "--- compat stats one-shot"; curl -s --max-time 10 --unix-socket $S "$API/containers/$ID/stats?stream=false" | head -c 3000; echo
          echo "--- compat exec"; EXEC=$(curl -s --unix-socket $S -H 'Content-Type: application/json' -d '{"Cmd":["sh","-c","exit 3"],"AttachStdout":true,"AttachStderr":true}' $API/containers/$ID/exec); echo "$EXEC"
          EID=$(echo "$EXEC" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Id",""))')
          curl -s --max-time 10 --unix-socket $S -H 'Content-Type: application/json' -d '{"Detach":false,"Tty":false}' $API/exec/$EID/start | head -c 300; echo
          echo "--- compat exec inspect"; curl -s --unix-socket $S $API/exec/$EID/json | head -c 600; echo
          echo "--- compat logs"; curl -s --unix-socket $S "$API/containers/$ID/logs?stdout=true&stderr=true&tail=5" | head -c 600; echo
          echo "--- compat events (3s)"; timeout 3 curl -s --unix-socket $S "$API/events?filters=%7B%22type%22%3A%5B%22container%22%5D%7D" | head -c 600; echo
      - name: Remove the Podman test container
        if: always() && runner.os == 'Linux'
        run: |
          podman rm -f sandbox-watcher-podman || true
          echo "--- podman service log"; cat /tmp/podman-service.log || true

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  app:
    name: Tauri app (${{ matrix.os }})
    needs: [core, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy -p sandbox-watcher --all-targets -- -D warnings
      # Unsigned debug build without installers: proves the shell compiles on
      # every OS. Signed bundles are an M7 deliverable.
      - run: pnpm tauri build --debug --no-bundle
