name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy -p sandbox-core --all-targets -- -D warnings
      - run: cargo test -p sandbox-core
      - name: Start a sandbox-like container for the Docker conformance test
        if: runner.os == 'Linux'
        run: |
          docker run -d --name sandbox-watcher-test \
            --label sandbox.project=watcher-test --label sandbox.hash=abcdef123456 \
            alpine:3 sh -c 'mkdir -p /tmp/sandbox-sessions && touch /tmp/.sandbox-ready && echo ready && sleep 600'
          for i in $(seq 1 20); do
            docker exec sandbox-watcher-test test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
      - name: Docker conformance test
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_TEST_SLUG: watcher-test
        run: cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Remove the test container
        if: always() && runner.os == 'Linux'
        run: docker rm -f sandbox-watcher-test || true

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  app:
    name: Tauri app (${{ matrix.os }})
    needs: [core, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy -p sandbox-watcher --all-targets -- -D warnings
      # Unsigned debug build without installers: proves the shell compiles on
      # every OS. Signed bundles are an M7 deliverable.
      - run: pnpm tauri build --debug --no-bundle
