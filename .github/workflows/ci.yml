name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository only; nothing here publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy -p sandbox-core --all-targets -- -D warnings
      - run: cargo test -p sandbox-core
      - name: Start a sandbox-like container for the Docker conformance test
        if: runner.os == 'Linux'
        run: |
          docker run -d --name sandbox-watcher-test \
            --label sandbox.project=watcher-test --label sandbox.hash=abcdef123456 \
            alpine:3 sh -c 'mkdir -p /tmp/sandbox-sessions && touch /tmp/.sandbox-ready && echo ready && sleep 600'
          for i in $(seq 1 20); do
            docker exec sandbox-watcher-test test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
      - name: Docker conformance test
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_TEST_SLUG: watcher-test
        run: cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Prepare SSH to localhost
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes localhost docker version --format '{{.Server.Version}}'
      - name: Docker conformance over SSH
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_TEST_SLUG: watcher-test
          SANDBOX_WATCHER_SSH_HOST: localhost
        # The previous conformance run ends by stopping the container.
        run: |
          docker start sandbox-watcher-test
          for i in $(seq 1 20); do
            docker exec sandbox-watcher-test test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
          cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Remove the test container
        if: always() && runner.os == 'Linux'
        run: docker rm -f sandbox-watcher-test || true
      - name: Start Podman's Docker-compatible socket and a sandbox-like container
        if: runner.os == 'Linux'
        run: |
          podman --version
          # Rootless Podman defaults to journald for events, which runners may lack.
          mkdir -p ~/.config/containers
          printf '[engine]\nevents_logger = "file"\n' > ~/.config/containers/containers.conf
          podman info --format 'events logger: {{.Host.EventLogger}}, cgroups: {{.Host.CgroupsVersion}}'
          # Remote detection over SSH reads the rootless default socket from `podman info`.
          SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
          mkdir -p "$(dirname "$SOCK")"
          echo "PODMAN_SOCK=$SOCK" >> "$GITHUB_ENV"
          nohup podman system service --time=0 "unix://$SOCK" >/tmp/podman-service.log 2>&1 &
          for i in $(seq 1 30); do [ -S "$SOCK" ] && break || sleep 0.5; done
          podman run -d --name sandbox-watcher-podman \
            --label sandbox.project=watcher-podman --label sandbox.hash=abcdef123456 \
            docker.io/library/alpine:3 sh -c 'mkdir -p /tmp/sandbox-sessions && touch /tmp/.sandbox-ready && echo ready && sleep 600'
          for i in $(seq 1 20); do
            podman exec sandbox-watcher-podman test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
      - name: Podman conformance test
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_RUNTIME: podman
          SANDBOX_WATCHER_TEST_SLUG: watcher-podman
          DOCKER_HOST: unix://${{ env.PODMAN_SOCK }}
        run: cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Podman conformance over SSH
        if: runner.os == 'Linux'
        env:
          SANDBOX_WATCHER_DOCKER_TESTS: "1"
          SANDBOX_WATCHER_RUNTIME: podman
          SANDBOX_WATCHER_TEST_SLUG: watcher-podman
          SANDBOX_WATCHER_SSH_HOST: localhost
        # The previous conformance run ends by stopping the container.
        run: |
          podman start sandbox-watcher-podman
          for i in $(seq 1 20); do
            podman exec sandbox-watcher-podman test -f /tmp/.sandbox-ready && break || sleep 0.5
          done
          cargo test -p sandbox-core --test conformance -- --nocapture
      - name: Podman diagnostics
        if: failure() && runner.os == 'Linux'
        run: |
          set +e
          echo "--- podman version"; podman version
          echo "--- podman info (host)"; podman info --format '{{json .Host}}' | head -c 2000; echo
          API=http://d/v1.47
          S="$PODMAN_SOCK"
          echo "--- compat /version"; curl -s --unix-socket $S $API/version | head -c 600; echo
          echo "--- compat containers (label filter)"; curl -s --unix-socket $S "$API/containers/json?all=true&filters=%7B%22label%22%3A%5B%22sandbox.project%3Dwatcher-podman%22%5D%7D" | head -c 3000; echo
          ID=$(podman ps -aq --filter name=sandbox-watcher-podman | head -1)
          echo "--- compat inspect"; curl -s --unix-socket $S $API/containers/$ID/json | head -c 4000; echo
          echo "--- compat stats one-shot"; curl -s --max-time 10 --unix-socket $S "$API/containers/$ID/stats?stream=false" | head -c 3000; echo
          echo "--- compat exec"; EXEC=$(curl -s --unix-socket $S -H 'Content-Type: application/json' -d '{"Cmd":["sh","-c","exit 3"],"AttachStdout":true,"AttachStderr":true}' $API/containers/$ID/exec); echo "$EXEC"
          EID=$(echo "$EXEC" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Id",""))')
          curl -s --max-time 10 --unix-socket $S -H 'Content-Type: application/json' -d '{"Detach":false,"Tty":false}' $API/exec/$EID/start | head -c 300; echo
          echo "--- compat exec inspect"; curl -s --unix-socket $S $API/exec/$EID/json | head -c 600; echo
          echo "--- compat logs"; curl -s --unix-socket $S "$API/containers/$ID/logs?stdout=true&stderr=true&tail=5" | head -c 600; echo
          echo "--- compat events (3s)"; timeout 3 curl -s --unix-socket $S "$API/events?filters=%7B%22type%22%3A%5B%22container%22%5D%7D" | head -c 600; echo
      - name: Remove the Podman test container
        if: always() && runner.os == 'Linux'
        run: |
          podman rm -f sandbox-watcher-podman || true
          echo "--- podman service log"; cat /tmp/podman-service.log || true

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # fixtures/contracts (written by the Rust contract tests) must
      # type-check against src/types.ts; see docs/CHECKS.md.
      - run: pnpm check:contracts
      - run: pnpm check:actions
      - run: pnpm build
      - run: pnpm build:site

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: perf
      # Wall-clock budgets are defined for the release profile on this
      # runner type; the limits leave 6 to 20 times headroom over the
      # baseline in docs/PERFORMANCE.md. Data-volume budgets run in every
      # `cargo test` already.
      - name: Budgets
        env:
          SANDBOX_WATCHER_BUDGETS: "1"
        run: cargo test --release -p sandbox-core --test budgets -- --nocapture
      - name: Measurements
        run: cargo bench -p sandbox-core --bench perf -- --quick --json target/perf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ github.sha }}
          path: target/perf.json
          retention-days: 90

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One CycloneDX file from Cargo.lock and pnpm-lock.yaml; Cargo.lock
      # already lists the crates of all three platforms.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sandbox-watcher.cdx.json
          artifact-name: sbom
          upload-release-assets: false

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  app:
    name: Tauri app (${{ matrix.os }})
    needs: [core, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy -p sandbox-watcher --all-targets -- -D warnings
      # Shell unit tests (remote-key guards, tray), which need the system
      # libraries above on Linux.
      - run: cargo test -p sandbox-watcher
      # Unsigned debug build without installers: proves the shell compiles on
      # every OS. Signed bundles are an M7 deliverable.
      - run: pnpm tauri build --debug --no-bundle
