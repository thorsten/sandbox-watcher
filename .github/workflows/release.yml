name: Release

# Builds installers for every platform and attaches them to a draft GitHub
# release. Triggered by pushing a tag like v0.2.0, or manually.
# Bundles are unsigned until M7 adds signing and notarisation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: notes
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/changelog.mjs --release "${{ github.ref_name }}" > notes.md
          else
            node scripts/changelog.mjs --unreleased > notes.md
          fi
          printf '\nUnsigned builds for macOS (Apple silicon), Windows and Linux. Install notes: https://thorsten.github.io/sandbox-watcher/\n' >> notes.md
          {
            echo 'body<<NOTES_EOF'
            cat notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Bundle (${{ matrix.name }})
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Sandbox Watcher ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
