name: Release

# Builds installers for every platform and attaches them to a draft GitHub
# release. Triggered by pushing a tag like v0.2.0, or manually.
# macOS bundles are signed and notarised once the APPLE_* secrets exist (see
# "macOS signing" in the README); until then, and on Windows, they are unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the jobs that create the release and attach
# files get `contents: write`. Signing secrets reach the bundle job only.
permissions:
  contents: read

env:
  # Secrets cannot be tested in step conditions, so expose only whether the
  # signing certificate is configured.
  APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: notes
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/changelog.mjs --release "${{ github.ref_name }}" > notes.md
          else
            node scripts/changelog.mjs --unreleased > notes.md
          fi
          if [ "$APPLE_SIGNING" = "true" ]; then
            builds='Signed and notarised build for macOS (Apple silicon); unsigned builds for Windows and Linux.'
          else
            builds='Unsigned builds for macOS (Apple silicon), Windows and Linux.'
          fi
          printf '\n%s Install notes: https://thorsten.github.io/sandbox-watcher/\n' "$builds" >> notes.md
          {
            echo 'body<<NOTES_EOF'
            cat notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Bundle (${{ matrix.name }})
    needs: notes
    # tauri-action creates the release and uploads the installers.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      # Hands the Apple secrets to the Tauri bundler, which imports the
      # certificate into a temporary keychain, signs and notarises. Only set
      # variables are exported: an empty APPLE_CERTIFICATE would fail the build.
      # Notarisation uses an App Store Connect API key if one is configured,
      # else the Apple ID with an app-specific password.
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s<<__APPLE_EOF__\n%s\n__APPLE_EOF__\n' "$1" "$2" >> "$GITHUB_ENV"
            fi
          }
          put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            put APPLE_API_KEY "$APPLE_API_KEY"
            put APPLE_API_KEY_PATH "$key_path"
          else
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Sandbox Watcher ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  sbom:
    name: SBOM
    needs: build
    # `gh release upload` attaches the SBOM to the release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      # Same scan as in CI, attached to the release next to the installers.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sandbox-watcher-${{ steps.tag.outputs.tag }}.cdx.json
          artifact-name: sbom
          upload-release-assets: false
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "sandbox-watcher-${{ steps.tag.outputs.tag }}.cdx.json" --clobber
